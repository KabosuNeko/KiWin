name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build KiWin.slnx -c Release

      - name: Build release bundle
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (dry-run headless)
        shell: pwsh
        run: ./dist/KiWin.exe headless=true dry-run=true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KiWin
          path: dist/
          if-no-files-found: error
